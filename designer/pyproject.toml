[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panelkit-studio"
version = "0.2.0"
description = "Visual editor and Arduino sketch generator for PanelKit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.2"]

[project.optional-dependencies]
fonts = ["glyph-bridge>=0.1.4"]

[project.scripts]
panelkit-studio = "panelkit_studio.__main__:main"

[tool.setuptools.package-data]
panelkit_studio = ["assets/*"]

